name: prismic-media-upload

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Public HTTPS directory the files are fetched from"
        required: true
        type: string
      files:
        description: "Comma-separated file names under base_url"
        required: true
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Fetch each file and post it to the Prismic Asset API
        env:
          BASE_URL: ${{ inputs.base_url }}
          FILES: ${{ inputs.files }}
          PRISMIC_WRITE_TOKEN: ${{ secrets.PRISMIC_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRISMIC_WRITE_TOKEN"
          case "$BASE_URL" in https://*) ;; *) echo "base_url must be https://"; exit 2 ;; esac
          IFS=',' read -r -d '' -a names <<< "$FILES" || true
          for raw in "${names[@]}"; do
            name="$(printf '%s' "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$name" ] && continue
            enc="$(jq -rn --arg s "$name" '$s|@uri')"
            curl -fsSL --proto '=https' --proto-redir '=https' -o "$name" "${BASE_URL%/}/$enc"
            type="$(file -b --mime-type "$name")"
            q=${name//\\/\\\\}
            q=${q//\"/\\\"}
            out="$(curl --fail-with-body -sS --retry 3 --retry-delay 2 -X POST https://asset-api.prismic.io/assets \
              -H "Authorization: Bearer $PRISMIC_WRITE_TOKEN" \
              -H "repository: williamson-construction" \
              -F "file=@\"$q\";type=$type")"
            echo "UPLOADED $name $out"
            rm -f -- "$name"
            sleep 1.2
          done
